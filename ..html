<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Аэронавигация</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 14px;
            color: #8e8e93;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .card {
            background: #1c1c1e;
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            border: none;
            text-align: left;
        }

        .card:active {
            transform: scale(0.96);
            background: #2c2c2e;
        }

        .card-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-desc {
            font-size: 12px;
            color: #8e8e93;
        }

        .btn {
            background: #0088cc;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.7;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .back-btn {
            background: none;
            border: none;
            color: #0088cc;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 16px;
            padding: 8px 0;
        }

        .topic-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .topic-item {
            background: #1c1c1e;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .topic-item:active {
            background: #2c2c2e;
        }

        .topic-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .topic-preview {
            font-size: 14px;
            color: #8e8e93;
            line-height: 1.4;
        }

        .content-screen {
            padding: 0;
        }

        .content-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .content-text {
            font-size: 15px;
            line-height: 1.6;
            color: #e5e5e7;
        }

        .content-text p {
            margin-bottom: 12px;
        }

        .search-box {
            background: #1c1c1e;
            border: none;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 16px;
            color: #ffffff;
            width: 100%;
            margin-bottom: 16px;
        }

        .search-box::placeholder {
            color: #8e8e93;
        }

        .search-box:focus {
            outline: none;
            background: #2c2c2e;
        }
    </style>
</head>
<body>
    <!-- Главное меню -->
    <div id="main-screen" class="screen active">
        <div class="header">
            <h1>Аэронавигация</h1>
            <p>Учебные материалы</p>
        </div>

        <div class="grid">
            <button class="card" onclick="showScreen('lectures')">
                <div class="card-icon">📚</div>
                <div class="card-title">Лекции</div>
                <div class="card-desc">Все темы курса</div>
            </button>

            <button class="card" onclick="showScreen('navigation')">
                <div class="card-icon">🧭</div>
                <div class="card-title">Навигация</div>
                <div class="card-desc">Основные понятия</div>
            </button>

            <button class="card" onclick="showScreen('instruments')">
                <div class="card-icon">📊</div>
                <div class="card-title">Приборы</div>
                <div class="card-desc">Компасы, высотомеры</div>
            </button>

            <button class="card" onclick="showScreen('flight')">
                <div class="card-icon">✈️</div>
                <div class="card-title">Полёт</div>
                <div class="card-desc">Этапы и процедуры</div>
            </button>

            <button class="card" onclick="showScreen('search')">
                <div class="card-icon">🔍</div>
                <div class="card-title">Поиск</div>
                <div class="card-desc">Найти материал</div>
            </button>

            <button class="card" onclick="showScreen('favorites')">
                <div class="card-icon">⭐</div>
                <div class="card-title">Избранное</div>
                <div class="card-desc">Сохранённые темы</div>
            </button>

            <button class="card" onclick="showScreen('tests')">
                <div class="card-icon">📝</div>
                <div class="card-title">Тесты</div>
                <div class="card-desc">Проверь знания</div>
            </button>

            <button class="card" onclick="showScreen('about')">
                <div class="card-icon">ℹ️</div>
                <div class="card-title">О приложении</div>
                <div class="card-desc">Информация</div>
            </button>
        </div>
    </div>

    <!-- Экран лекций -->
    <div id="lectures-screen" class="screen">
        <button class="back-btn" onclick="showScreen('main')">← Назад</button>
        <h2 style="margin-bottom: 16px;">Лекции</h2>
        <div id="lectures-list" class="topic-list"></div>
    </div>

    <!-- Экран навигации -->
    <div id="navigation-screen" class="screen">
        <button class="back-btn" onclick="showScreen('main')">← Назад</button>
        <h2 style="margin-bottom: 16px;">Навигация</h2>
        <div id="navigation-list" class="topic-list"></div>
    </div>

    <!-- Экран приборов -->
    <div id="instruments-screen" class="screen">
        <button class="back-btn" onclick="showScreen('main')">← Назад</button>
        <h2 style="margin-bottom: 16px;">Приборы</h2>
        <div id="instruments-list" class="topic-list"></div>
    </div>

    <!-- Экран полёта -->
    <div id="flight-screen" class="screen">
        <button class="back-btn" onclick="showScreen('main')">← Назад</button>
        <h2 style="margin-bottom: 16px;">Полёт</h2>
        <div id="flight-list" class="topic-list"></div>
    </div>

    <!-- Экран поиска -->
    <div id="search-screen" class="screen">
        <button class="back-btn" onclick="showScreen('main')">← Назад</button>
        <h2 style="margin-bottom: 16px;">Поиск</h2>
        <input type="text" class="search-box" placeholder="Введите запрос..." oninput="searchTopics(this.value)">
        <div id="search-results" class="topic-list"></div>
    </div>

    <!-- Экран избранного -->
    <div id="favorites-screen" class="screen">
        <button class="back-btn" onclick="showScreen('main')">← Назад</button>
        <h2 style="margin-bottom: 16px;">Избранное</h2>
        <div id="favorites-list" class="topic-list">
            <p style="color: #8e8e93; text-align: center; padding: 40px 0;">Пока пусто</p>
        </div>
    </div>

    <!-- Экран тестов -->
    <div id="tests-screen" class="screen">
        <button class="back-btn" onclick="showScreen('main')">← Назад</button>
        <h2 style="margin-bottom: 16px;">Тесты</h2>
        <p style="color: #8e8e93; text-align: center; padding: 40px 0;">Скоро здесь появятся тесты</p>
    </div>

    <!-- Экран о приложении -->
    <div id="about-screen" class="screen">
        <button class="back-btn" onclick="showScreen('main')">← Назад</button>
        <h2 style="margin-bottom: 16px;">О приложении</h2>
        <div style="background: #1c1c1e; border-radius: 12px; padding: 20px;">
            <p style="margin-bottom: 12px;">Учебное приложение по аэронавигации</p>
            <p style="color: #8e8e93; font-size: 14px;">Версия 1.0</p>
        </div>
    </div>

    <!-- Экран контента -->
    <div id="content-screen" class="screen content-screen">
        <button class="back-btn" onclick="goBack()">← Назад</button>
        <h2 class="content-title" id="content-title"></h2>
        <div class="content-text" id="content-text"></div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Данные из твоего файла
        const TH = [
            ['Аэронавигация и требования к ней', ['Аэронавигация — наука о том, как вести самолёт из одной точки земли в другую точно, надёжно и безопасно, по заданной в пространстве траектории.', 'ПМС — точка, где в данный момент находится центр масс самолёта. МС — её проекция на землю. Линия, которую описывает МС, — линия пути. Требования: безопасность (главное), точность, экономичность, регулярность.']],
            ['Системы координат', ['Геодезическая система — широта и долгота на эллипсоиде Земли. Сферическая — широта φ и долгота λ на шаре. За форму Земли берут геоид — поверхность, совпадающую со средним уровнем морей.', 'Ортодромия — дуга большого круга, самый короткий путь между двумя точками на сфере. Линии заданного пути в навигации обычно задают ортодромией. Локсодромия пересекает меридианы под постоянным углом.']],
            ['Навигационные и пилотажные элементы', ['Пилотажные элементы — крен, тангаж, курс: угловое положение самолёта. Навигационные — координаты и движение, то есть скорость.', 'Vи — скорость относительно воздуха, W — путевая скорость относительно земли, ФПУ — направление W относительно меридиана, ЗПУ — направление линии пути.']]
        ];

        const NAVIGATION = [
            ['Понятие о комплексном применении навигационных средств', ['Комплексное применение — разумное использование избыточной информации ради точного и безопасного полёта. Это одно из основных правил аэронавигации.', 'Что входит: своевременно выбирать средства и методы, проверять их показания дублирующими средствами, знать счисленные координаты, учитывать точность и надёжность каждого средства.']],
            ['Контроль и исправление пути', ['Контроль по направлению определяет сторону и величину ЛБУ. Контроль по дальности — пройденное и оставшееся расстояние до ППМ.']]
        ];

        const INSTRUMENTS = [
            ['Принципы измерения курса. Магнитный компас КИ-13', ['КИ-13 — простой магнитный компас: плюсы — простота, надёжность, не нужен ток. Минусы — низкая точность, большие ошибки на разворотах, долгое успокоение.', 'Девиация — ошибка компаса из-за железа на самолёте. Полукруговая и четвертная зависят от курса. Креновая возникает при развороте и тангаже, ускорительная — при разгоне и торможении.']],
            ['Гироскопический принцип измерения курса', ['Гироскоп сохраняет направление своей оси. Карданов подвес даёт три степени свободы. Гирополукомпас ГПК сам не знает, где север: пилот выставляет его ось по выбранному направлению.', 'Горизонтальная коррекция — маятник с пузырьком и контактами возвращает ось в горизонтальное положение. Азимутальная коррекция компенсирует уход оси из-за вращения Земли.']],
            ['Правила установки давления на шкале высотомера', ['QNE — стандартное давление 760 мм рт. ст., по нему летают на эшелонах. QFE — давление аэродрома, для взлёта и посадки. QNH — давление аэродрома, приведённое к уровню моря по стандартной атмосфере.', 'Порядок: перед вылетом на шкале стоит QFE. На высоте перехода все ставят QNE. При снижении до эшелона перехода снова ставят QFE или QNH.']]
        ];

        const FLIGHT = [
            ['Этапы маршрутного полёта', ['Полёт состоит из взлёта, вылета по схеме, маршрута (набор высоты, горизонтальный полёт, снижение), захода на посадку и посадки. Если посадка невозможна, выполняют уход на второй круг.', 'Взлёт и посадка короткие и обычно выполняются в визуальных условиях. Самые сложные с точки зрения навигации — маневры в районе аэродрома: вылет, прибытие и заход на посадку.']],
            ['Технология полёта по маршруту', ['Технологию задаёт руководство по лётной эксплуатации самолёта, но она не может быть жёсткой, потому что обстановка в каждом полёте разная.', 'Главные правила: контролировать выдерживание траектории и курса, определять навигационные элементы и ветер, рассчитывать время пролёта ППМ, следить за топливом и рубежом ухода на запасной аэродром.']]
        ];

        let currentScreen = 'main';
        let previousScreen = 'main';

        function showScreen(screen) {
            previousScreen = currentScreen;
            currentScreen = screen;
            
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screen + '-screen').classList.add('active');

            if (screen === 'lectures') renderList('lectures-list', TH);
            if (screen === 'navigation') renderList('navigation-list', NAVIGATION);
            if (screen === 'instruments') renderList('instruments-list', INSTRUMENTS);
            if (screen === 'flight') renderList('flight-list', FLIGHT);
        }

        function renderList(elementId, data) {
            const list = document.getElementById(elementId);
            list.innerHTML = data.map((item, i) => `
                <div class="topic-item" onclick="showContent(${i}, '${elementId.replace('-list', '')}')">
                    <div class="topic-title">${item[0]}</div>
                    <div class="topic-preview">${item[1][0].substring(0, 100)}...</div>
                </div>
            `).join('');
        }

        function showContent(index, category) {
            let data;
            if (category === 'lectures') data = TH;
            else if (category === 'navigation') data = NAVIGATION;
            else if (category === 'instruments') data = INSTRUMENTS;
            else if (category === 'flight') data = FLIGHT;

            const item = data[index];
            document.getElementById('content-title').textContent = item[0];
            document.getElementById('content-text').innerHTML = item[1].map(p => `<p>${p}</p>`).join('');
            
            previousScreen = currentScreen;
            currentScreen = 'content';
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('content-screen').classList.add('active');
        }

        function goBack() {
            showScreen(previousScreen);
        }

        function searchTopics(query) {
            const allTopics = [...TH, ...NAVIGATION, ...INSTRUMENTS, ...FLIGHT];
            const results = allTopics.filter(item => 
                item[0].toLowerCase().includes(query.toLowerCase()) ||
                item[1].some(p => p.toLowerCase().includes(query.toLowerCase()))
            );

            const list = document.getElementById('search-results');
            if (results.length === 0) {
                list.innerHTML = '<p style="color: #8e8e93; text-align: center; padding: 40px 0;">Ничего не найдено</p>';
            } else {
                list.innerHTML = results.map(item => `
                    <div class="topic-item">
                        <div class="topic-title">${item[0]}</div>
                        <div class="topic-preview">${item[1][0].substring(0, 100)}...</div>
                    </div>
                `).join('');
            }
        }
    </script>
</body>
</html>
